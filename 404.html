<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Fatma Kocaova Mimarlık</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0c">
<!-- Bu sayfa herhangi bir derinlikteki adres için sunulabildiğinden
     dış dosyaya bağlanmaz; ihtiyaç duyduğu az sayıda stil buraya gömülüdür. -->
<link rel="preload" href="assets/fonts/maison-neue-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/maison-neue-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: #0d0d0c;
    color: #f2f2f0;
    font-family: "Maison Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    text-align: center;
  }
  .code {
    font-family: "Maison Neue", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: clamp(5rem, 22vw, 13rem);
    line-height: 1;
    color: #9a9a94;
    margin: 0;
  }
  h1 {
    font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.25rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 0.5rem 0 0;
    text-wrap: balance;
  }
  p {
    max-width: 44ch;
    margin: 1.25rem auto 2rem;
    color: rgba(242, 242, 240, 0.7);
  }
  a {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.75rem;
    background: #f2f2f0;
    color: #0d0d0c;
    border: 1px solid #f2f2f0;
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.35s, border-color 0.35s, color 0.35s;
  }
  a:hover, a:focus-visible {
    background: transparent;
    border-color: #f2f2f0;
    color: #f2f2f0;
  }
  a:focus-visible { outline: 2px solid #9a9a94; outline-offset: 3px; }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Sayfa taşınmış veya adres yanlış yazılmış olabilir.</p>
    <a href="./">
      Anasayfaya Dön
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </a>
  </main>
</body>
</html>
