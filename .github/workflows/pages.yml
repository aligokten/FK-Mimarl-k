# Siteyi GitHub Pages üzerinde yayınlar.
#
# Tek seferlik ayar: Depo > Settings > Pages > Build and deployment >
# Source alanını "GitHub Actions" olarak seçin.
#
# Derleme adımı yoktur; depo kökü olduğu gibi yayınlanır.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Asistan iş akışı, kendi commit'inden sonra yayını buradan çağırır:
  # GITHUB_TOKEN ile atılan push yukarıdaki push tetikleyicisini
  # çalıştırmaz (bkz. .github/workflows/asistan.yml).
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; sıradaki beklesin (devam eden yayın iptal edilmez)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_tekrar.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # data/*.json -> HTML. Yönetim paneli yalnızca JSON'a yazdığı için
      # sayfalar burada yeniden üretilir.
      - name: İçeriği derle
        run: python3 tools/build.py

      # Not: Pages'i iş akışı kendi etkinleştiremez (GITHUB_TOKEN'ın
      # "create Pages site" izni yoktur). Ayar bir kez elle açılmalıdır.
      - name: Pages yapılandırmasını hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Paket yüklendikten hemen sonra GitHub'ın paket listeleme API'si onu
      # bazen birkaç saniye göstermiyor; deploy-pages da tam o anda bu API'ye
      # sorup "No artifacts named github-pages were found" hatasıyla düşüyordu.
      # Burada aynı API, paket görünene kadar (en çok 60 sn) sorulur. Süre
      # dolarsa adım hata vermez; yayın denenir, düşerse aşağıda bir kez
      # daha denenir.
      - name: Paketin görünmesini bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            SAYI=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                     --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${SAYI:-0}" -ge 1 ]; then
              echo "Paket görünür durumda ($i. sorgu)."
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Paket 60 sn içinde listede görünmedi; yayın yine de deneniyor."

      - name: Yayınla
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # İlk deneme düştüyse kısa bir bekleme sonrası bir kez daha denenir.
      # deploy-pages paketi bulamadığında yayın kaydı oluşturmadan durduğu
      # için ikinci deneme güvenlidir. Bu adım da düşerse iş başarısız olur.
      - name: Yayını yeniden dene
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::İlk yayın denemesi başarısız oldu; 20 sn sonra yeniden deneniyor."
          sleep 20

      - name: Yayınla (ikinci deneme)
        id: deployment_tekrar
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
